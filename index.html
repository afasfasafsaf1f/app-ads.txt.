<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- Перенаправление через HTML-тег (на всякий случай) -->
    <meta http-equiv="refresh" content="0; url=https://github.io">
    <title>Redirecting...</title>
</head>
<body>
    <!-- Перенаправление через JavaScript для мгновенного срабатывания -->
    <script>
        window.location.href = "https://github.io";
    </script>
    <p>Если перенаправление не произошло, <a href="https://github.io">нажмите сюда</a>.</p>
</body>
</html>
